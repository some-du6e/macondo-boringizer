name: Release Extension

on:
  workflow_dispatch:
    inputs:
      publish_to_store:
        description: Publish stable build to Chrome Web Store
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set release metadata
        id: release_meta
        run: |
          set -euo pipefail

          COMMIT_MSG="$(git log -1 --pretty=%B | tr -d '\r')"
          COMMIT_PREFIX_HEX="$(printf '%s' "$COMMIT_MSG" | xxd -p -l 4)"
          TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"
          SHORT_SHA="${GITHUB_SHA::7}"

          # Explicit manual publish requests should always package and publish a stable build.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish_to_store || 'false' }}" = "true" ]; then
            echo "channel=stable" >> "${GITHUB_OUTPUT}"
            echo "tag=stable-${TIMESTAMP}-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
            echo "release_name=Stable ${TIMESTAMP} (${SHORT_SHA})" >> "${GITHUB_OUTPUT}"
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "$COMMIT_PREFIX_HEX" = "f09f9a80" ]; then
            echo "channel=stable" >> "${GITHUB_OUTPUT}"
            echo "tag=stable-${TIMESTAMP}-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
            echo "release_name=Stable ${TIMESTAMP} (${SHORT_SHA})" >> "${GITHUB_OUTPUT}"
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          else
            echo "channel=nightly" >> "${GITHUB_OUTPUT}"
            echo "tag=nightly-${TIMESTAMP}-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
            echo "release_name=Nightly ${TIMESTAMP} (${SHORT_SHA})" >> "${GITHUB_OUTPUT}"
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          fi
        shell: bash

      - name: Check types
        run: bunx tsc --noEmit

      # Stamp a unique version per build so AMO/CWS never reject a re-upload as a
      # duplicate. `github.run_number` increments every run, so the manifest
      # version becomes MAJOR.MINOR.<run_number> (e.g. 1.0.517). The build
      # steps below read this stamped manifest, so both Chrome and Firefox
      # packages carry the same unique version.
      - name: Stamp build version
        id: stamp_version
        run: |
          set -euo pipefail
          export RUN_NUMBER="${{ github.run_number }}"
          node -e '
            const fs = require("fs");
            const p = "src/manifest.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            const base = String(m.version || "1.0.0").split(".");
            const major = base[0] || "1";
            const minor = base[1] || "0";
            m.version = `${major}.${minor}.${process.env.RUN_NUMBER}`;
            fs.writeFileSync(p, JSON.stringify(m, null, 4) + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${m.version}\n`);
          '

      - name: Build extension package
        run: |
          bun run build:chrome -- --zip --zip-filename macondoboringizerchrome
          mv "dist/chrome/macondoboringizerchrome.zip" "dist/chrome/macondo-boringizer-chrome.zip"

      - name: Build Firefox extension package
        run: |
          bun run build:firefox -- --zip --zip-filename macondoboringizerfirefox
          mv "dist/firefox/macondoboringizerfirefox.zip" "dist/firefox/macondo-boringizer-firefox.zip"

      - name: Build release notes
        id: release_notes
        run: |
          set -euo pipefail

          NEW_TAG="${{ steps.release_meta.outputs.tag }}"
          REPO="${{ github.repository }}"

          # Find the most recent existing release tag that isn't this one, so
          # we can diff HEAD from it for the "what changed" list.
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${NEW_TAG}$" | head -1 || true)
          if [ -z "${PREV_TAG}" ]; then
            COMMIT_LIST="- (first release)"
            COMPARE_URL="https://github.com/${REPO}/releases/tag/${NEW_TAG}"
          else
            COMMIT_LIST=$(git log --pretty='- %s' "${PREV_TAG}..HEAD" 2>/dev/null \
              || git log --pretty='- %s' -10)
            COMPARE_URL="https://github.com/${REPO}/compare/${PREV_TAG}...${NEW_TAG}"
          fi
          export COMMIT_LIST COMPARE_URL

          # Substitute the template's two auto-filled lines. We replace the
          # whole bullet line (including its leading "- ") with the commit
          # list, since the commits are already "- "-prefixed.
          cp release-notes.md release-notes-filled.md
          perl -i -pe 's/^- _auto-filled: commit subjects since last release_$/$ENV{COMMIT_LIST}/' release-notes-filled.md
          perl -i -pe 's/_auto-filled_/$ENV{COMPARE_URL}/' release-notes-filled.md

          echo "Body preview:"
          cat release-notes-filled.md

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: |
            dist/chrome/macondo-boringizer-chrome.zip
            dist/firefox/macondo-boringizer-firefox.zip
          bodyFile: release-notes-filled.md
          makeLatest: ${{ steps.release_meta.outputs.channel == 'stable' && 'true' || 'false' }}
          name: ${{ steps.release_meta.outputs.release_name }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          removeArtifacts: true
          tag: ${{ steps.release_meta.outputs.tag }}

      # Sign the Firefox XPI through AMO on every release, as its own .xpi file.
      # `--channel unlisted` so nightly self-distribution doesn't need AMO
      # review. web-ext names the output .xpi from the manifest version, so
      # it's unique per build (e.g. macondo_boringizer-1.0.517.xpi).
      - name: Sign Firefox XPI (AMO)
        id: sign_xpi
        run: |
          set -euo pipefail
          mkdir -p dist/firefox-signed
          bunx web-ext sign \
            --source-dir dist/firefox \
            --artifacts-dir dist/firefox-signed \
            --api-key "${{ secrets.AMO_API_KEY }}" \
            --api-secret "${{ secrets.AMO_API_SECRET }}" \
            --channel unlisted

      - name: Attach signed XPI to release
        if: ${{ steps.sign_xpi.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.release_meta.outputs.tag }}" dist/firefox-signed/*.xpi --clobber

      - name: Publish to Chrome Web Store
        if: ${{ steps.release_meta.outputs.channel == 'stable' && github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_store == 'true' }}
        uses: mobilefirstllc/cws-publish@latest
        with:
          action: publish
          client_id: ${{ secrets.CHROME_CLIENT_ID }}
          client_secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          extension_id: ${{ secrets.CHROME_EXTENSION_ID }}
          refresh_token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          zip_file: dist/chrome/macondo-boringizer-chrome.zip
